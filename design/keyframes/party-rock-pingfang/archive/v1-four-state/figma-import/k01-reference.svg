<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <g id="canvas"><rect width="1440" height="900" fill="#F2F1E6"/></g>
  <g id="global-nav"><rect width="76" height="900" fill="#121212"/><rect x="18" y="22" width="40" height="40" rx="13" fill="#A855F7" stroke="#F2F1E6" stroke-width="2"/><text x="38" y="49" fill="#121212" font-size="19" font-family="PingFang SC, Noto Sans SC, Arial" text-anchor="middle" font-weight="700">对</text><text x="38" y="136" fill="#121212" font-size="12" text-anchor="middle">⌁</text><rect x="10" y="153" width="56" height="56" rx="16" fill="#C084FC"/><text x="38" y="181" fill="#121212" font-size="12" text-anchor="middle">对齐</text><text x="38" y="267" fill="#F2F1E6" font-size="12" text-anchor="middle">◉</text><text x="38" y="286" fill="#F2F1E6" font-size="12" text-anchor="middle">母版</text><text x="38" y="355" fill="#F2F1E6" font-size="12" text-anchor="middle">≡</text><text x="38" y="374" fill="#F2F1E6" font-size="12" text-anchor="middle">记录</text><text x="38" y="842" fill="#F2F1E6" font-size="12" text-anchor="middle">？</text></g>
  <g id="context-rail"><rect x="76" width="236" height="900" fill="#F5F4EA" stroke="#121212" stroke-opacity=".2"/><text x="100" y="52" fill="#121212" font-size="11" opacity=".58">当前项目</text><text x="100" y="82" fill="#121212" font-size="23" font-family="PingFang SC, Noto Sans SC, Arial" font-weight="700">新建母版</text><line x1="100" y1="116" x2="288" y2="116" stroke="#121212" stroke-opacity=".2"/><text x="100" y="148" fill="#121212" font-size="12" opacity=".58">母版参照</text><rect x="100" y="169" width="42" height="42" rx="14" fill="#C084FC" stroke="#121212"/><circle cx="121" cy="187" r="10" fill="none" stroke="#121212" stroke-width="2"/><text x="154" y="187" fill="#121212" font-size="13" font-weight="600">尚未建立</text><text x="154" y="204" fill="#121212" font-size="11" opacity=".58">上传后确认</text><line x1="100" y1="251" x2="288" y2="251" stroke="#121212" stroke-opacity=".2"/><text x="100" y="282" fill="#121212" font-size="12" opacity=".58">任务</text><text x="100" y="316" fill="#121212" font-size="13">＋ 新建任务</text><text x="100" y="352" fill="#121212" font-size="13" opacity=".58">最近一次对齐</text><text x="100" y="835" fill="#121212" font-size="11" opacity=".58">只记录任务事实，不保存<br/>永久图片资产。</text></g>
  <g id="alignment-workspace"><text x="356" y="63" fill="#121212" font-size="11" opacity=".58">对齐工作区</text><text x="356" y="103" fill="#121212" font-size="34" font-family="PingFang SC, Noto Sans SC, Arial" font-weight="700">建立母版</text><text x="1065" y="70" fill="#121212" font-size="12" opacity=".58" text-anchor="end">先建立一张你认可的长期参照</text><line x1="820" y1="145" x2="820" y2="730" stroke="#A855F7" stroke-width="2"/><circle cx="820" cy="145" r="9" fill="#F2F1E6" stroke="#A855F7" stroke-width="2"/><circle cx="820" cy="730" r="9" fill="#F2F1E6" stroke="#A855F7" stroke-width="2"/><g id="reference-upload-card"><rect x="356" y="158" width="216" height="390" rx="26" fill="#FFFFFF" fill-opacity=".35" stroke="#121212"/><text x="378" y="192" fill="#121212" font-size="14" font-weight="700">建立母版</text><text x="550" y="192" fill="#121212" font-size="11" opacity=".58" text-anchor="end">长期参照</text><rect x="369" y="213" width="190" height="320" rx="20" fill="#FFFFFF" fill-opacity=".35" stroke="#121212" stroke-dasharray="5 5"/><circle cx="464" cy="337" r="23" fill="none" stroke="#121212"/><text x="464" y="345" fill="#121212" font-size="28" text-anchor="middle">＋</text><text x="464" y="392" fill="#121212" font-size="16" text-anchor="middle" font-weight="600">上传母版照片</text><text x="464" y="417" fill="#121212" font-size="11" text-anchor="middle" opacity=".58">本人 · 单人 · 清晰 · 接近正面</text></g><g id="axis-card"><rect x="844" y="158" width="216" height="390" rx="26" fill="#FFFFFF" fill-opacity=".35" stroke="#121212"/><text x="866" y="192" fill="#121212" font-size="14" font-weight="700">对齐轴</text><text x="1038" y="192" fill="#121212" font-size="11" opacity=".58" text-anchor="end">等待母版</text><rect x="857" y="213" width="190" height="320" rx="20" fill="#F2F1E6" fill-opacity=".7" stroke="#121212"/><ellipse cx="952" cy="333" rx="57" ry="68" fill="none" stroke="#121212" stroke-width="3"/><path d="M915 420 Q952 380 989 420" fill="none" stroke="#121212" stroke-width="3"/><path d="M918 344h68M929 332v24M975 332v24" fill="none" stroke="#121212" stroke-width="2" opacity=".7"/></g><text x="356" y="624" fill="#121212" font-size="13" opacity=".58">建立后，Agent 会自动检查母版是否适合成为长期参照。</text><rect x="888" y="595" width="172" height="48" rx="24" fill="#A855F7" stroke="#121212"/><text x="974" y="625" fill="#121212" font-size="13" text-anchor="middle" font-weight="700">上传母版照片</text></g>
  <g id="agent-panel"><rect x="1088" width="352" height="900" fill="#FFFFFF" fill-opacity=".42" stroke="#121212" stroke-opacity=".2"/><text x="1114" y="57" fill="#121212" font-size="16" font-weight="700">Agent</text><text x="1414" y="57" fill="#121212" font-size="11" opacity=".58" text-anchor="end">等待母版</text><line x1="1088" y1="82" x2="1440" y2="82" stroke="#121212" stroke-opacity=".2"/><g id="agent-message"><rect x="1114" y="112" width="287" height="92" rx="17" fill="#FFFFFF" fill-opacity=".64" stroke="#121212" stroke-opacity=".2"/><text x="1132" y="136" fill="#121212" font-size="10" opacity=".58">Agent</text><text x="1132" y="162" fill="#121212" font-size="13">先上传一张你认可的本人照片。</text><text x="1132" y="185" fill="#121212" font-size="13">它会成为之后对齐的参照。</text></g><rect x="1114" y="226" width="287" height="121" rx="17" fill="#F2F1E6" stroke="#121212"/><text x="1132" y="254" fill="#121212" font-size="12" font-weight="700">母版条件</text><text x="1382" y="254" fill="#121212" font-size="11" opacity=".58" text-anchor="end">展开</text><text x="1132" y="285" fill="#121212" font-size="12">本人、单人</text><text x="1382" y="285" fill="#121212" font-size="11" opacity=".58" text-anchor="end">必须满足</text><text x="1132" y="315" fill="#121212" font-size="12">清晰、眼睛可见</text><text x="1382" y="315" fill="#121212" font-size="11" opacity=".58" text-anchor="end">建议</text><rect x="1114" y="748" width="287" height="92" rx="20" fill="#F2F1E6" stroke="#121212"/><text x="1132" y="778" fill="#121212" font-size="13" opacity=".58">继续告诉我想保留什么…</text><circle cx="1366" cy="812" r="18" fill="#A855F7" stroke="#121212"/><text x="1366" y="818" fill="#121212" font-size="18" text-anchor="middle">↑</text><text x="1116" y="862" fill="#121212" font-size="10" opacity=".58">自然语言是主控制面；复杂依据按需展开。</text></g>
</svg>
