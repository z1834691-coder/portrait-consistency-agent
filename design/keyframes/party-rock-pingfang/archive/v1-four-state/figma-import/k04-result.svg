<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <g id="canvas"><rect width="1440" height="900" fill="#F2F1E6"/></g>
  <g id="global-nav"><rect width="76" height="900" fill="#121212"/><rect x="18" y="22" width="40" height="40" rx="13" fill="#A855F7" stroke="#F2F1E6" stroke-width="2"/><text x="38" y="49" fill="#121212" font-size="19" text-anchor="middle" font-family="PingFang SC, Noto Sans SC, Arial" font-weight="700">对</text><rect x="10" y="153" width="56" height="56" rx="16" fill="#C084FC"/><text x="38" y="181" fill="#121212" font-size="12" text-anchor="middle">对齐</text><text x="38" y="286" fill="#F2F1E6" font-size="12" text-anchor="middle">母版</text><text x="38" y="374" fill="#F2F1E6" font-size="12" text-anchor="middle">记录</text><text x="38" y="842" fill="#F2F1E6" font-size="12" text-anchor="middle">？</text></g>
  <g id="context-rail"><rect x="76" width="236" height="900" fill="#F5F4EA" stroke="#121212" stroke-opacity=".2"/><text x="100" y="52" font-size="11" fill="#121212" opacity=".58">当前项目</text><text x="100" y="82" font-size="23" fill="#121212" font-family="PingFang SC, Noto Sans SC, Arial" font-weight="700">夏日人像</text><line x1="100" y1="116" x2="288" y2="116" stroke="#121212" stroke-opacity=".2"/><text x="100" y="148" font-size="12" fill="#121212" opacity=".58">母版参照</text><rect x="100" y="169" width="42" height="42" rx="14" fill="#C084FC" stroke="#121212"/><circle cx="121" cy="187" r="10" fill="none" stroke="#121212" stroke-width="2"/><text x="154" y="187" font-size="13" fill="#121212" font-weight="600">母版 01</text><text x="154" y="204" font-size="11" fill="#121212" opacity=".58">已确认 · 版本 01</text><rect x="100" y="229" width="112" height="26" rx="13" fill="#C084FC" stroke="#121212"/><circle cx="116" cy="242" r="4" fill="#A855F7"/><text x="128" y="246" font-size="11" fill="#121212">母版已确认</text><line x1="100" y1="285" x2="288" y2="285" stroke="#121212" stroke-opacity=".2"/><text x="100" y="318" font-size="12" fill="#121212" opacity=".58">任务</text><text x="100" y="352" font-size="13" fill="#121212">当前对齐 · 已返回</text><text x="100" y="388" font-size="13" fill="#121212" opacity=".58">＋ 新建任务</text><text x="100" y="835" font-size="11" fill="#121212" opacity=".58">结果图只在当前会话内存中<br/>可用，过期不会自动重发。</text></g>
  <g id="alignment-workspace"><text x="356" y="63" font-size="11" fill="#121212" opacity=".58">对齐工作区</text><text x="356" y="103" font-size="34" fill="#121212" font-family="PingFang SC, Noto Sans SC, Arial" font-weight="700">结果已返回</text><text x="1065" y="70" font-size="12" fill="#121212" opacity=".58" text-anchor="end">先看变化，再决定是否继续</text><g id="before-card"><rect x="356" y="158" width="316" height="390" rx="26" fill="#FFFFFF" fill-opacity=".35" stroke="#121212"/><text x="378" y="192" font-size="14" fill="#121212" font-weight="700">修前</text><text x="642" y="192" font-size="11" fill="#121212" opacity=".58" text-anchor="end">当前照片</text><rect x="369" y="213" width="290" height="320" rx="20" fill="#FFFFFF" fill-opacity=".35" stroke="#121212"/><ellipse cx="514" cy="333" rx="57" ry="68" fill="none" stroke="#121212" stroke-width="3"/><path d="M477 420 Q514 380 551 420" fill="none" stroke="#121212" stroke-width="3"/><path d="M480 344h68M491 332v24M537 332v24" fill="none" stroke="#121212" stroke-width="2" opacity=".7"/></g><g id="after-card"><rect x="704" y="158" width="316" height="390" rx="26" fill="#FFFFFF" fill-opacity=".35" stroke="#121212"/><text x="726" y="192" font-size="14" fill="#121212" font-weight="700">修后</text><text x="990" y="192" font-size="11" fill="#121212" opacity=".58" text-anchor="end">临时结果图</text><rect x="717" y="213" width="290" height="320" rx="20" fill="#C084FC" stroke="#121212"/><ellipse cx="862" cy="333" rx="52" ry="65" fill="none" stroke="#121212" stroke-width="3"/><path d="M825 420 Q862 380 899 420" fill="none" stroke="#121212" stroke-width="3"/><path d="M831 344h62M842 332v24M882 332v24" fill="none" stroke="#121212" stroke-width="2" opacity=".7"/></g><rect x="356" y="592" width="664" height="73" rx="18" fill="#FFFFFF" fill-opacity=".45" stroke="#121212"/><text x="378" y="624" font-size="14" fill="#121212" font-weight="600">脸型的可测量差异缩小了</text><text x="378" y="648" font-size="12" fill="#121212" opacity=".58">眼睛本轮无法可靠复测；Provider 回执成功与复测改善是两件事。</text><rect x="848" y="694" width="172" height="48" rx="24" fill="#A855F7" stroke="#121212"/><text x="934" y="724" font-size="13" fill="#121212" text-anchor="middle" font-weight="700">查看结果</text></g>
  <g id="agent-panel"><rect x="1088" width="352" height="900" fill="#FFFFFF" fill-opacity=".42" stroke="#121212" stroke-opacity=".2"/><text x="1114" y="57" font-size="16" fill="#121212" font-weight="700">Agent</text><text x="1414" y="57" font-size="11" fill="#121212" opacity=".58" text-anchor="end">等待你的反馈</text><line x1="1088" y1="82" x2="1440" y2="82" stroke="#121212" stroke-opacity=".2"/><rect x="1114" y="112" width="287" height="90" rx="17" fill="#FFFFFF" fill-opacity=".64" stroke="#121212" stroke-opacity=".2"/><text x="1132" y="137" font-size="10" fill="#121212" opacity=".58">Agent · 结果已返回</text><text x="1132" y="164" font-size="13" fill="#121212">结果已返回，我正在确认变化</text><text x="1132" y="187" font-size="13" fill="#121212">是否朝你的目标移动。</text><rect x="1114" y="222" width="287" height="154" rx="17" fill="#F2F1E6" stroke="#121212"/><text x="1132" y="251" font-size="12" fill="#121212" font-weight="700">复测结论</text><text x="1379" y="251" font-size="11" fill="#121212" opacity=".58" text-anchor="end">已完成</text><text x="1132" y="284" font-size="12" fill="#121212">脸型</text><text x="1379" y="284" font-size="11" fill="#121212" opacity=".58" text-anchor="end">差异缩小</text><text x="1132" y="315" font-size="12" fill="#121212">眼睛</text><text x="1379" y="315" font-size="11" fill="#121212" opacity=".58" text-anchor="end">无法可靠复测</text><text x="1132" y="346" font-size="12" fill="#121212">Provider 回执</text><text x="1379" y="346" font-size="11" fill="#121212" opacity=".58" text-anchor="end">已返回</text><g id="feedback-row"><rect x="1114" y="406" width="128" height="38" rx="19" fill="#C084FC" stroke="#121212"/><text x="1178" y="431" font-size="12" fill="#121212" text-anchor="middle">可以了</text><rect x="1250" y="406" width="151" height="38" rx="19" fill="#F2F1E6" stroke="#121212"/><text x="1325" y="431" font-size="12" fill="#121212" text-anchor="middle">不满意，先停止</text></g><rect x="1114" y="748" width="287" height="92" rx="20" fill="#F2F1E6" stroke="#121212"/><text x="1132" y="778" font-size="13" fill="#121212" opacity=".58">继续告诉我想保留什么…</text><circle cx="1366" cy="812" r="18" fill="#A855F7" stroke="#121212"/><text x="1366" y="818" fill="#121212" font-size="18" text-anchor="middle">↑</text><text x="1116" y="862" fill="#121212" font-size="10" opacity=".58">不满意会停止当前计划族。</text></g>
</svg>
