<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <g id="canvas"><rect width="1440" height="900" fill="#F2F1E6"/></g>
  <g id="global-nav"><rect width="76" height="900" fill="#121212"/><rect x="18" y="22" width="40" height="40" rx="13" fill="#A855F7" stroke="#F2F1E6" stroke-width="2"/><text x="38" y="49" fill="#121212" font-size="19" text-anchor="middle" font-family="PingFang SC, Noto Sans SC, Arial" font-weight="700">对</text><rect x="10" y="153" width="56" height="56" rx="16" fill="#C084FC"/><text x="38" y="181" fill="#121212" font-size="12" text-anchor="middle">对齐</text><text x="38" y="286" fill="#F2F1E6" font-size="12" text-anchor="middle">母版</text><text x="38" y="374" fill="#F2F1E6" font-size="12" text-anchor="middle">记录</text><text x="38" y="842" fill="#F2F1E6" font-size="12" text-anchor="middle">？</text></g>
  <g id="context-rail"><rect x="76" width="236" height="900" fill="#F5F4EA" stroke="#121212" stroke-opacity=".2"/><text x="100" y="52" font-size="11" fill="#121212" opacity=".58">当前项目</text><text x="100" y="82" font-size="23" fill="#121212" font-family="PingFang SC, Noto Sans SC, Arial" font-weight="700">夏日人像</text><line x1="100" y1="116" x2="288" y2="116" stroke="#121212" stroke-opacity=".2"/><text x="100" y="148" font-size="12" fill="#121212" opacity=".58">母版参照</text><rect x="100" y="169" width="42" height="42" rx="14" fill="#C084FC" stroke="#121212"/><circle cx="121" cy="187" r="10" fill="none" stroke="#121212" stroke-width="2"/><text x="154" y="187" font-size="13" fill="#121212" font-weight="600">母版 01</text><text x="154" y="204" font-size="11" fill="#121212" opacity=".58">已确认 · 版本 01</text><rect x="100" y="229" width="112" height="26" rx="13" fill="#C084FC" stroke="#121212"/><circle cx="116" cy="242" r="4" fill="#A855F7"/><text x="128" y="246" font-size="11" fill="#121212">母版已确认</text><line x1="100" y1="285" x2="288" y2="285" stroke="#121212" stroke-opacity=".2"/><text x="100" y="318" font-size="12" fill="#121212" opacity=".58">任务</text><text x="100" y="352" font-size="13" fill="#121212">＋ 新建任务</text><text x="100" y="388" font-size="13" fill="#121212" opacity=".58">当前对齐</text></g>
  <g id="alignment-workspace"><text x="356" y="63" font-size="11" fill="#121212" opacity=".58">对齐工作区</text><text x="356" y="103" font-size="34" fill="#121212" font-family="PingFang SC, Noto Sans SC, Arial" font-weight="700">正在检查</text><text x="1065" y="70" font-size="12" fill="#121212" opacity=".58" text-anchor="end">这一步不需要你操作</text><line x1="820" y1="145" x2="820" y2="730" stroke="#A855F7" stroke-width="2"/><circle cx="820" cy="145" r="9" fill="#F2F1E6" stroke="#A855F7" stroke-width="2"/><circle cx="820" cy="730" r="9" fill="#F2F1E6" stroke="#A855F7" stroke-width="2"/><g id="reference-card"><rect x="356" y="158" width="216" height="390" rx="26" fill="#FFFFFF" fill-opacity=".35" stroke="#121212"/><text x="378" y="192" font-size="14" fill="#121212" font-weight="700">母版</text><text x="550" y="192" font-size="11" fill="#121212" opacity=".58" text-anchor="end">参照</text><rect x="369" y="213" width="190" height="320" rx="20" fill="#C084FC" stroke="#121212"/><ellipse cx="464" cy="333" rx="57" ry="68" fill="none" stroke="#121212" stroke-width="3"/><path d="M427 420 Q464 380 501 420" fill="none" stroke="#121212" stroke-width="3"/><path d="M430 344h68M441 332v24M487 332v24" fill="none" stroke="#121212" stroke-width="2" opacity=".7"/></g><g id="target-photo-card"><rect x="844" y="158" width="216" height="390" rx="26" fill="#FFFFFF" fill-opacity=".35" stroke="#121212"/><text x="866" y="192" font-size="14" fill="#121212" font-weight="700">当前照片</text><text x="1038" y="192" font-size="11" fill="#121212" opacity=".58" text-anchor="end">正在检查</text><rect x="857" y="213" width="190" height="320" rx="20" fill="#FFFFFF" fill-opacity=".35" stroke="#121212"/><ellipse cx="952" cy="333" rx="57" ry="68" fill="none" stroke="#121212" stroke-width="3" opacity=".75"/><path d="M915 420 Q952 380 989 420" fill="none" stroke="#121212" stroke-width="3" opacity=".75"/><path d="M918 344h68M929 332v24M975 332v24" fill="none" stroke="#121212" stroke-width="2" opacity=".55"/><circle cx="952" cy="480" r="14" fill="#A855F7"/><path d="M946 480h12" stroke="#121212" stroke-width="2"/></g><text x="356" y="624" font-size="13" fill="#121212" opacity=".58">质量、同人和内容安全会自动检查；出现问题时我会直接说明。</text></g>
  <g id="agent-panel"><rect x="1088" width="352" height="900" fill="#FFFFFF" fill-opacity=".42" stroke="#121212" stroke-opacity=".2"/><text x="1114" y="57" font-size="16" fill="#121212" font-weight="700">Agent</text><text x="1414" y="57" font-size="11" fill="#121212" opacity=".58" text-anchor="end">自动检查中</text><line x1="1088" y1="82" x2="1440" y2="82" stroke="#121212" stroke-opacity=".2"/><rect x="1114" y="112" width="287" height="73" rx="17" fill="#C084FC" stroke="#121212"/><text x="1132" y="137" font-size="10" fill="#121212" opacity=".58">你</text><text x="1132" y="164" font-size="13" fill="#121212">把这张向母版靠拢，保留妆面。</text><rect x="1114" y="201" width="287" height="105" rx="17" fill="#FFFFFF" fill-opacity=".64" stroke="#121212" stroke-opacity=".2"/><text x="1132" y="226" font-size="10" fill="#121212" opacity=".58">Agent · 正在检查</text><text x="1132" y="253" font-size="13" fill="#121212">我先确认这张照片是否适合比较和调整。</text><text x="1132" y="279" font-size="12" fill="#121212" opacity=".58">这一步不需要你操作。</text><rect x="1114" y="327" width="287" height="154" rx="17" fill="#F2F1E6" stroke="#121212"/><text x="1132" y="356" font-size="12" fill="#121212" font-weight="700">当前检查</text><text x="1379" y="356" font-size="11" fill="#121212" opacity=".58" text-anchor="end">进行中</text><text x="1132" y="389" font-size="12" fill="#121212">照片质量</text><text x="1379" y="389" font-size="11" fill="#121212" opacity=".58" text-anchor="end">检查中</text><text x="1132" y="420" font-size="12" fill="#121212">同人关系</text><text x="1379" y="420" font-size="11" fill="#121212" opacity=".58" text-anchor="end">等待</text><text x="1132" y="451" font-size="12" fill="#121212">内容安全</text><text x="1379" y="451" font-size="11" fill="#121212" opacity=".58" text-anchor="end">自动检查</text><rect x="1114" y="748" width="287" height="92" rx="20" fill="#F2F1E6" stroke="#121212"/><text x="1132" y="778" font-size="13" fill="#121212" opacity=".58">继续告诉我想保留什么…</text><circle cx="1366" cy="812" r="18" fill="#A855F7" stroke="#121212"/><text x="1366" y="818" font-size="18" fill="#121212" text-anchor="middle">↑</text><text x="1116" y="862" font-size="10" fill="#121212" opacity=".58">自然语言是主控制面；复杂依据按需展开。</text></g>
</svg>
