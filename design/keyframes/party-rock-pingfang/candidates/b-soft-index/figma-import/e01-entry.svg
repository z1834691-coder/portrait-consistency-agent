<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Soft Index E01 入口</title><desc id="desc">极简索引式入口，黑色左导航与米白工作台。</desc>
  <rect id="canvas" width="1440" height="900" fill="#F2F1E6"/>
  <g id="nav" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif"><rect width="92" height="900" fill="#000000"/><rect x="22" y="26" width="48" height="48" rx="15" fill="#C084FC" stroke="#F2F1E6" stroke-width="2"/><path d="M36 50h20M46 40v20" stroke="#121212" stroke-width="3" stroke-linecap="round"/><g fill="#F2F1E6" font-size="12" text-anchor="middle"><rect x="12" y="116" width="68" height="68" rx="18" fill="#A855F7"/><text x="46" y="145" fill="#121212">对齐</text><text x="46" y="165" fill="#121212" font-size="10">当前</text><text x="46" y="239">母版</text><text x="46" y="313">记录</text></g><path d="M27 370h38" stroke="#F2F1E6" stroke-opacity=".28"/><g fill="#F2F1E6" font-size="10" text-anchor="middle" opacity=".75"><text x="46" y="790">帮助</text><text x="46" y="842">设置</text></g></g>
  <g id="context" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" fill="#121212"><rect x="92" width="238" height="900" fill="#F2F1E6"/><path d="M330 0v900" stroke="#121212" stroke-opacity=".2"/><text x="122" y="66" font-size="12" letter-spacing="2" opacity=".52">PROJECT 01</text><text x="122" y="108" font-size="22" font-weight="700">人像一致性项目</text><rect x="118" y="148" width="146" height="36" rx="18" fill="#C084FC" stroke="#121212" stroke-width="1.5"/><text x="138" y="171" font-size="13">建立模板</text><rect x="118" y="196" width="108" height="32" rx="16" fill="none" stroke="#A855F7" stroke-width="1.5"/><text x="138" y="217" font-size="13">模板库</text><rect x="118" y="240" width="120" height="32" rx="16" fill="none" stroke="#A855F7" stroke-width="1.5"/><text x="138" y="261" font-size="13">新建对象</text><path d="M122 340h156" stroke="#121212" stroke-opacity=".22"/><text x="122" y="380" font-size="12" opacity=".55">当前项目</text><rect x="118" y="400" width="164" height="80" rx="20" fill="none" stroke="#121212" stroke-width="2"/><text x="140" y="435" font-size="15" font-weight="600">未建立母版</text><circle cx="139" cy="460" r="5" fill="#36FF9B"/><text x="153" y="465" font-size="12">等待第一张照片</text><text x="122" y="816" font-size="12" opacity=".55">结果不会变成永久图库</text></g>
  <g id="workspace" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" fill="#121212"><text x="374" y="76" font-size="12" letter-spacing="2" opacity=".52">SOFT INDEX / ENTRY</text><rect x="374" y="106" width="280" height="46" rx="23" fill="none" stroke="#121212" stroke-width="2"/><text x="398" y="136" font-size="16" font-weight="600">当前项目 / 未建立母版</text><circle cx="625" cy="129" r="6" fill="#36FF9B"/><text x="374" y="234" font-size="38" font-weight="700">建立母版</text><text x="374" y="270" font-size="16" opacity=".62">先上传一张你认可的本人照片。</text><g id="upload"><rect x="374" y="320" width="690" height="272" rx="28" fill="#F2F1E6" stroke="#121212" stroke-width="2.5"/><rect x="420" y="366" width="118" height="174" rx="20" fill="#F2F1E6" stroke="#A855F7" stroke-width="2"/><path d="M446 480c12-32 52-32 64 0M458 442c0-17 32-17 32 0" fill="none" stroke="#121212" stroke-width="2.5" opacity=".27"/><path d="M590 438h96M638 390v96" stroke="#A855F7" stroke-width="4" stroke-linecap="round"/><text x="738" y="438" font-size="23" font-weight="700">上传母版照片</text><text x="738" y="474" font-size="14" opacity=".58">把你的标准放在这里，之后每次都可以直接说。</text><rect x="738" y="504" width="116" height="34" rx="17" fill="#A855F7"/><text x="760" y="526" font-size="13">选择照片</text></g><g id="composer"><rect x="374" y="642" width="690" height="86" rx="24" fill="#F2F1E6" stroke="#121212" stroke-width="2"/><text x="402" y="694" font-size="16" opacity=".52">直接告诉我目标……</text><circle cx="1019" cy="685" r="23" fill="#A855F7"/><path d="M1011 685h16M1019 677v16" stroke="#121212" stroke-width="2.5" stroke-linecap="round"/><text x="374" y="786" font-size="14" opacity=".62">已有母版，开始对齐</text><path d="M552 781h18" stroke="#A855F7" stroke-width="3" stroke-linecap="round"/></g></g>
  <g id="notes" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" fill="#121212"><rect x="1110" y="108" width="230" height="132" rx="24" fill="#C084FC"/><text x="1140" y="148" font-size="12" letter-spacing="1.5">AGENT READY</text><text x="1140" y="182" font-size="16" font-weight="600">我会先看照片，</text><text x="1140" y="208" font-size="16" font-weight="600">再告诉你下一步。</text><circle cx="1298" cy="146" r="7" fill="#36FF9B" stroke="#121212" stroke-width="1.5"/></g>
</svg>
