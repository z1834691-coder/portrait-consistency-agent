<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Soft Index E02 Agent 对话</title><desc id="desc">索引式证据工作区和米白 Agent 对话面。</desc>
  <rect id="canvas" width="1440" height="900" fill="#F2F1E6"/>
  <g id="nav" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif"><rect width="92" height="900" fill="#000000"/><rect x="22" y="26" width="48" height="48" rx="15" fill="#C084FC" stroke="#F2F1E6" stroke-width="2"/><path d="M36 50h20M46 40v20" stroke="#121212" stroke-width="3" stroke-linecap="round"/><g fill="#F2F1E6" font-size="12" text-anchor="middle"><rect x="12" y="116" width="68" height="68" rx="18" fill="#A855F7"/><text x="46" y="145" fill="#121212">对齐</text><text x="46" y="165" fill="#121212" font-size="10">当前</text><text x="46" y="239">母版</text><text x="46" y="313">记录</text></g><path d="M27 370h38" stroke="#F2F1E6" stroke-opacity=".28"/><g fill="#F2F1E6" font-size="10" text-anchor="middle" opacity=".75"><text x="46" y="790">帮助</text><text x="46" y="842">设置</text></g></g>
  <g id="context" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" fill="#121212"><rect x="92" width="238" height="900" fill="#F2F1E6"/><path d="M330 0v900" stroke="#121212" stroke-opacity=".2"/><text x="122" y="66" font-size="12" letter-spacing="2" opacity=".52">CURRENT TASK</text><text x="122" y="108" font-size="22" font-weight="700">本次对齐</text><rect x="118" y="148" width="146" height="36" rx="18" fill="#C084FC" stroke="#121212" stroke-width="1.5"/><text x="138" y="171" font-size="13">母版已确认</text><path d="M122 232h156" stroke="#121212" stroke-opacity=".22"/><text x="122" y="272" font-size="12" opacity=".55">当前照片</text><text x="122" y="306" font-size="16" font-weight="600">等待复测</text><circle cx="129" cy="346" r="5" fill="#36FF9B"/><text x="144" y="351" font-size="13">正在对齐</text><path d="M122 400h156" stroke="#121212" stroke-opacity=".22"/><text x="122" y="440" font-size="12" opacity=".55">范围</text><text x="122" y="474" font-size="14">只处理脸型与眼睛</text><text x="122" y="816" font-size="12" opacity=".55">结果仅在本轮可见</text></g>
  <g id="workspace" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" fill="#121212"><text x="374" y="72" font-size="12" letter-spacing="2" opacity=".52">SOFT INDEX / SESSION 01</text><text x="374" y="120" font-size="28" font-weight="700">对齐进度</text><g id="index-strip"><rect x="374" y="168" width="186" height="134" rx="22" fill="none" stroke="#121212" stroke-width="2"/><text x="400" y="205" font-size="12" opacity=".55">01</text><text x="400" y="244" font-size="17" font-weight="600">当前照片</text><text x="400" y="274" font-size="13" opacity=".62">已收到</text><rect x="580" y="168" width="186" height="134" rx="22" fill="#C084FC" stroke="#121212" stroke-width="2"/><text x="606" y="205" font-size="12" opacity=".55">02</text><text x="606" y="244" font-size="17" font-weight="600">差异摘要</text><text x="606" y="274" font-size="13">可可靠测量</text><rect x="786" y="168" width="186" height="134" rx="22" fill="none" stroke="#121212" stroke-width="2"/><text x="812" y="205" font-size="12" opacity=".55">03</text><text x="812" y="244" font-size="17" font-weight="600">结果</text><text x="812" y="274" font-size="13" opacity=".62">等待一次处理</text><path d="M560 235h20M766 235h20" stroke="#A855F7" stroke-width="4" stroke-linecap="round"/></g><g id="evidence"><rect x="374" y="356" width="598" height="236" rx="28" fill="#F2F1E6" stroke="#121212" stroke-width="2.5"/><rect x="418" y="398" width="126" height="168" rx="20" fill="none" stroke="#A855F7" stroke-width="2"/><path d="M444 506c12-32 54-32 66 0M456 466c0-18 34-18 34 0" fill="none" stroke="#121212" stroke-width="2.5" opacity=".25"/><text x="584" y="426" font-size="12" opacity=".55">母版 / 当前照片</text><text x="584" y="470" font-size="19" font-weight="600">保留妆面</text><text x="584" y="505" font-size="14" opacity=".62">脸型与眼睛可可靠测量</text><rect x="584" y="532" width="104" height="30" rx="15" fill="#A855F7"/><text x="604" y="552" font-size="12">范围已明确</text></g></g>
  <g id="agent" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" fill="#121212"><rect x="1022" y="26" width="390" height="848" rx="28" fill="#F2F1E6" stroke="#121212" stroke-width="2.5"/><text x="1056" y="76" font-size="12" letter-spacing="2" opacity=".52">AGENT</text><text x="1056" y="114" font-size="22" font-weight="700">一起完成</text><circle cx="1362" cy="106" r="6" fill="#36FF9B"/><rect x="1056" y="158" width="282" height="70" rx="20" fill="#C084FC" stroke="#121212" stroke-width="1.5"/><text x="1080" y="189" font-size="14">把这张向母版靠拢，</text><text x="1080" y="211" font-size="14">保留妆面。</text><text x="1056" y="274" font-size="14" font-weight="600">我先确认这张照片</text><text x="1056" y="300" font-size="14" font-weight="600">适不适合比较。</text><rect x="1056" y="348" width="310" height="108" rx="20" fill="none" stroke="#121212" stroke-width="1.5"/><text x="1080" y="383" font-size="13" opacity=".55">下一步</text><text x="1080" y="416" font-size="14">现在需要你确认这一次</text><text x="1080" y="441" font-size="14">外部处理。</text><rect x="1080" y="476" width="142" height="38" rx="19" fill="#A855F7" stroke="#121212" stroke-width="1.5"/><text x="1100" y="500" font-size="13">确认这一次</text><rect id="composer" x="1056" y="764" width="310" height="72" rx="22" fill="#F2F1E6" stroke="#121212" stroke-width="2"/><text x="1080" y="805" font-size="13" opacity=".5">继续告诉我想保留什么……</text><circle cx="1330" cy="800" r="18" fill="#A855F7"/><path d="M1323 800h14M1330 793v14" stroke="#121212" stroke-width="2" stroke-linecap="round"/></g>
</svg>
