<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Archive Ribbon E02 Agent 对话</title>
  <desc id="desc">米白对齐工作区与右侧 Agent 对话，黑色左导航和紫色档案游线。</desc>
  <rect id="canvas" width="1440" height="900" fill="#F2F1E6"/>
  <g id="nav" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif">
    <rect width="96" height="900" fill="#000000"/>
    <rect x="24" y="26" width="48" height="48" rx="15" fill="#A855F7" stroke="#F2F1E6" stroke-width="2"/>
    <path d="M38 50h20M48 40v20" stroke="#121212" stroke-width="3" stroke-linecap="round"/>
    <g fill="#F2F1E6" font-size="12" text-anchor="middle"><rect x="13" y="116" width="70" height="70" rx="18" fill="#A855F7"/><text x="48" y="146" fill="#121212">对齐</text><text x="48" y="166" fill="#121212" font-size="10">当前</text><text x="48" y="242">母版</text><text x="48" y="318">记录</text></g>
    <path d="M28 374h40" stroke="#F2F1E6" stroke-opacity=".28"/><g fill="#F2F1E6" font-size="10" text-anchor="middle" opacity=".78"><text x="48" y="790">帮助</text><text x="48" y="842">设置</text></g>
  </g>
  <g id="context" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" fill="#121212">
    <rect x="96" width="246" height="900" fill="#F2F1E6"/><path d="M342 0v900" stroke="#121212" stroke-opacity=".2"/>
    <text x="124" y="65" font-size="12" letter-spacing="2" opacity=".52">CURRENT TASK</text><text x="124" y="108" font-size="22" font-weight="700">本次对齐</text>
    <rect x="120" y="148" width="154" height="38" rx="19" fill="#C084FC" stroke="#121212" stroke-width="1.5"/><text x="142" y="172" font-size="13">母版已确认</text>
    <path d="M124 236h156" stroke="#121212" stroke-opacity=".22"/><text x="124" y="274" font-size="12" opacity=".58">母版</text><text x="124" y="305" font-size="16" font-weight="600">春日肖像 · v01</text>
    <rect x="124" y="340" width="78" height="108" rx="18" fill="#F2F1E6" stroke="#121212" stroke-width="2"/><path d="M145 414c10-28 42-28 52 0M154 382c0-15 25-15 25 0" fill="none" stroke="#121212" stroke-width="2" opacity=".34"/><text x="124" y="482" font-size="12" opacity=".55">当前照片</text><text x="124" y="510" font-size="14" font-weight="600">等待结果</text>
    <circle cx="130" cy="558" r="5" fill="#36FF9B"/><text x="145" y="563" font-size="13">正在对齐</text><text x="124" y="816" font-size="12" opacity=".55">结果仅在本次会话可见</text>
  </g>
  <g id="workspace" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" fill="#121212">
    <text x="386" y="68" font-size="12" letter-spacing="2" opacity=".52">ALIGNMENT / SESSION 01</text><text x="386" y="112" font-size="28" font-weight="700">这次照片</text>
    <g id="trajectory" fill="none" stroke-linecap="round"><path d="M466 310 C560 250 650 378 748 302 S900 260 976 334" stroke="#A855F7" stroke-width="12"/><circle cx="466" cy="310" r="9" fill="#A855F7" stroke="#121212" stroke-width="3"/><circle cx="976" cy="334" r="9" fill="#36FF9B" stroke="#121212" stroke-width="3"/></g>
    <rect id="reference" x="390" y="184" width="168" height="238" rx="24" fill="#F2F1E6" stroke="#121212" stroke-width="3"/><rect id="current" x="778" y="194" width="168" height="238" rx="24" fill="#F2F1E6" stroke="#121212" stroke-width="3"/><path d="M430 340c14-38 56-38 72 0M446 296c0-20 34-20 34 0" fill="none" stroke="#121212" stroke-width="2.5" opacity=".25"/><path d="M818 350c14-38 56-38 72 0M834 306c0-20 34-20 34 0" fill="none" stroke="#121212" stroke-width="2.5" opacity=".2"/>
    <text x="410" y="462" font-size="12" letter-spacing="1.5">母版</text><text x="798" y="472" font-size="12" letter-spacing="1.5">当前照片</text>
    <rect id="difference" x="390" y="528" width="556" height="96" rx="22" fill="#F2F1E6" stroke="#121212" stroke-width="2"/><text x="418" y="566" font-size="12" opacity=".52">差异摘要</text><text x="418" y="600" font-size="16" font-weight="600">脸型与眼睛可以可靠测量</text><rect x="790" y="556" width="110" height="34" rx="17" fill="#C084FC"/><text x="810" y="578" font-size="12">妆面保留</text>
  </g>
  <g id="agent" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" fill="#121212">
    <rect x="1016" y="26" width="394" height="848" rx="28" fill="#F2F1E6" stroke="#121212" stroke-width="2.5"/><text x="1052" y="78" font-size="12" letter-spacing="2" opacity=".52">AGENT</text><text x="1052" y="116" font-size="22" font-weight="700">一起完成</text><circle cx="1360" cy="108" r="6" fill="#36FF9B"/>
    <rect x="1052" y="158" width="274" height="72" rx="20" fill="#C084FC" stroke="#121212" stroke-width="1.5"/><text x="1075" y="187" font-size="14">把这张向母版靠拢，</text><text x="1075" y="210" font-size="14">保留妆面。</text>
    <text x="1052" y="276" font-size="14" font-weight="600">收到。</text><text x="1052" y="302" font-size="14">我会保留妆面，只处理</text><text x="1052" y="326" font-size="14">可可靠测量的脸型和眼睛。</text>
    <rect x="1052" y="368" width="312" height="116" rx="20" fill="#F2F1E6" stroke="#121212" stroke-width="1.5"/><text x="1075" y="402" font-size="13" opacity=".58">下一步</text><text x="1075" y="433" font-size="14">这一步会发送当前照片；</text><text x="1075" y="456" font-size="14">只尝试一次。</text><rect x="1075" y="500" width="142" height="38" rx="19" fill="#A855F7" stroke="#121212" stroke-width="1.5"/><text x="1095" y="524" font-size="13">确认这一次</text>
    <rect id="composer" x="1052" y="764" width="312" height="72" rx="22" fill="#F2F1E6" stroke="#121212" stroke-width="2"/><text x="1075" y="805" font-size="13" opacity=".5">继续告诉我想保留什么……</text><circle cx="1328" cy="800" r="18" fill="#A855F7"/><path d="M1321 800h14M1328 793v14" stroke="#121212" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
