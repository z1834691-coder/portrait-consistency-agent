<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Open Provenance E02 Agent 对话</title><desc id="desc">横向谱系轨迹与嵌入式 Agent 对话。</desc>
  <rect id="canvas" width="1440" height="900" fill="#F2F1E6"/>
  <g id="nav" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif"><rect width="88" height="900" fill="#000000"/><rect x="20" y="26" width="48" height="48" rx="15" fill="#A855F7" stroke="#F2F1E6" stroke-width="2"/><path d="M34 50h20M44 40v20" stroke="#121212" stroke-width="3" stroke-linecap="round"/><g fill="#F2F1E6" font-size="12" text-anchor="middle"><rect x="11" y="116" width="66" height="66" rx="18" fill="#C084FC"/><text x="44" y="145" fill="#121212">对齐</text><text x="44" y="164" fill="#121212" font-size="10">当前</text><text x="44" y="238">母版</text><text x="44" y="312">记录</text></g><path d="M25 370h38" stroke="#F2F1E6" stroke-opacity=".28"/><g fill="#F2F1E6" font-size="10" text-anchor="middle" opacity=".75"><text x="44" y="790">帮助</text><text x="44" y="842">设置</text></g></g>
  <g id="context" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" fill="#121212"><rect x="88" width="250" height="900" fill="#F2F1E6"/><path d="M338 0v900" stroke="#121212" stroke-opacity=".18"/><text x="122" y="66" font-size="12" letter-spacing="2" opacity=".52">OPEN PROVENANCE</text><text x="122" y="112" font-size="22" font-weight="700">本次对齐</text><rect x="118" y="150" width="154" height="36" rx="18" fill="#C084FC" stroke="#121212" stroke-width="1.5"/><text x="140" y="173" font-size="13">母版已确认</text><path d="M122 238h158" stroke="#121212" stroke-opacity=".22"/><text x="122" y="278" font-size="12" opacity=".55">当前目标</text><text x="122" y="314" font-size="15" font-weight="600">保留妆面</text><circle cx="129" cy="354" r="5" fill="#36FF9B"/><text x="144" y="359" font-size="13">正在复测</text><text x="122" y="816" font-size="12" opacity=".55">结果仅在本轮可见</text></g>
  <g id="workspace" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" fill="#121212"><text x="386" y="70" font-size="12" letter-spacing="2" opacity=".52">OPEN PROVENANCE / SESSION 01</text><path d="M386 108h12v62h-12M1356 108h-12v62h12" fill="none" stroke="#121212" stroke-width="2"/><text x="414" y="150" font-size="32" font-weight="700">一次对齐，一条路径</text><g id="trajectory" fill="none" stroke-linecap="round"><path d="M452 286H1284" stroke="#121212" stroke-width="2" opacity=".35"/><path d="M570 286H974" stroke="#A855F7" stroke-width="8"/><circle cx="570" cy="286" r="13" fill="#A855F7" stroke="#121212" stroke-width="3"/><circle cx="774" cy="286" r="13" fill="#C084FC" stroke="#121212" stroke-width="3"/><circle cx="974" cy="286" r="13" fill="#36FF9B" stroke="#121212" stroke-width="3"/><circle cx="1284" cy="286" r="10" fill="#F2F1E6" stroke="#121212" stroke-width="2"/></g><g id="nodes"><text x="516" y="244" font-size="12" opacity=".55">01</text><text x="516" y="334" font-size="17" font-weight="600">母版</text><text x="720" y="244" font-size="12" opacity=".55">02</text><text x="720" y="334" font-size="17" font-weight="600">这次照片</text><text x="904" y="244" font-size="12" opacity=".55">03</text><text x="904" y="334" font-size="17" font-weight="600">我会怎么处理</text><text x="1232" y="334" font-size="17" font-weight="600">结果</text></g><rect id="evidence" x="420" y="394" width="510" height="184" rx="28" fill="#F2F1E6" stroke="#121212" stroke-width="2"/><text x="452" y="438" font-size="12" opacity=".55">当前事实</text><text x="452" y="482" font-size="18" font-weight="600">照片已检查</text><text x="452" y="518" font-size="14" opacity=".62">下一步会发送给已列明的处理方。</text><rect x="452" y="540" width="118" height="30" rx="15" fill="#C084FC"/><text x="473" y="560" font-size="12">范围已明确</text></g>
  <g id="agent" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" fill="#121212"><rect x="974" y="394" width="390" height="456" rx="28" fill="#F2F1E6" stroke="#121212" stroke-width="2.5"/><text x="1008" y="438" font-size="12" letter-spacing="2" opacity=".55">AGENT / 旁白</text><circle cx="1314" cy="432" r="6" fill="#36FF9B"/><rect x="1008" y="470" width="278" height="62" rx="19" fill="#C084FC" stroke="#121212" stroke-width="1.5"/><text x="1032" y="507" font-size="14">把这张向母版靠拢，保留妆面。</text><text x="1008" y="572" font-size="14" font-weight="600">结果已返回，我正在确认</text><text x="1008" y="598" font-size="14" font-weight="600">变化是否朝目标移动。</text><rect x="1008" y="644" width="300" height="68" rx="20" fill="none" stroke="#121212" stroke-width="1.5"/><text x="1032" y="682" font-size="13" opacity=".56">继续告诉我想保留什么……</text><circle cx="1278" cy="678" r="18" fill="#A855F7"/><path d="M1271 678h14M1278 671v14" stroke="#121212" stroke-width="2" stroke-linecap="round"/></g>
  <g id="footer" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" fill="#121212"><text x="420" y="674" font-size="14" opacity=".62">授权、结果、反馈都在同一条对话里完成。</text><path d="M420 700h440" stroke="#121212" stroke-opacity=".18"/></g>
</svg>
