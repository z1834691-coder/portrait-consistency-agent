<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Open Provenance E01 入口</title><desc id="desc">开放谱系式入口，米白编辑画布、黑色导航和横向轨迹。</desc>
  <rect id="canvas" width="1440" height="900" fill="#F2F1E6"/>
  <g id="nav" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif"><rect width="88" height="900" fill="#000000"/><rect x="20" y="26" width="48" height="48" rx="15" fill="#A855F7" stroke="#F2F1E6" stroke-width="2"/><path d="M34 50h20M44 40v20" stroke="#121212" stroke-width="3" stroke-linecap="round"/><g fill="#F2F1E6" font-size="12" text-anchor="middle"><rect x="11" y="116" width="66" height="66" rx="18" fill="#C084FC"/><text x="44" y="145" fill="#121212">对齐</text><text x="44" y="164" fill="#121212" font-size="10">当前</text><text x="44" y="238">母版</text><text x="44" y="312">记录</text></g><path d="M25 370h38" stroke="#F2F1E6" stroke-opacity=".28"/><g fill="#F2F1E6" font-size="10" text-anchor="middle" opacity=".75"><text x="44" y="790">帮助</text><text x="44" y="842">设置</text></g></g>
  <g id="context" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" fill="#121212"><rect x="88" width="250" height="900" fill="#F2F1E6"/><path d="M338 0v900" stroke="#121212" stroke-opacity=".18"/><text x="122" y="66" font-size="12" letter-spacing="2" opacity=".52">OPEN PROVENANCE</text><text x="122" y="112" font-size="22" font-weight="700">人像一致性项目</text><g font-size="13"><rect x="118" y="150" width="150" height="36" rx="18" fill="#C084FC" stroke="#121212" stroke-width="1.5"/><text x="140" y="173">建立模板</text><rect x="118" y="198" width="106" height="32" rx="16" fill="none" stroke="#A855F7" stroke-width="1.5"/><text x="140" y="219">模板库</text><rect x="118" y="242" width="118" height="32" rx="16" fill="none" stroke="#A855F7" stroke-width="1.5"/><text x="140" y="263">新建对象</text></g><path d="M122 340h158" stroke="#121212" stroke-opacity=".22"/><text x="122" y="380" font-size="12" opacity=".55">一条清晰的路径</text><text x="122" y="416" font-size="15" font-weight="600">从母版到这次照片</text><circle cx="129" cy="462" r="5" fill="#36FF9B"/><text x="144" y="467" font-size="13">等待你的第一步</text><text x="122" y="816" font-size="12" opacity=".55">只展示当前任务的事实</text></g>
  <g id="workspace" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" fill="#121212"><text x="388" y="76" font-size="12" letter-spacing="2" opacity=".52">OPEN PROVENANCE / ENTRY</text><path d="M388 115h12v66h-12M706 115h-12v66h12" fill="none" stroke="#121212" stroke-width="2"/><text x="416" y="157" font-size="42" font-weight="700">开始对齐</text><text x="388" y="222" font-size="16" opacity=".62">先上传一张你认可的本人照片。</text><g id="trajectory" fill="none" stroke-linecap="round"><path d="M468 430 H1190" stroke="#121212" stroke-width="2" opacity=".35"/><path d="M590 430 H830" stroke="#A855F7" stroke-width="8"/><circle cx="590" cy="430" r="15" fill="#A855F7" stroke="#121212" stroke-width="3"/><circle cx="830" cy="430" r="13" fill="#36FF9B" stroke="#121212" stroke-width="3"/><circle cx="1190" cy="430" r="10" fill="#F2F1E6" stroke="#121212" stroke-width="2"/></g><g id="nodes"><rect x="438" y="340" width="178" height="128" rx="24" fill="#F2F1E6" stroke="#121212" stroke-width="2"/><text x="466" y="382" font-size="12" opacity=".55">01</text><text x="466" y="420" font-size="18" font-weight="600">母版</text><text x="466" y="449" font-size="13" opacity=".58">长期标准</text><rect x="738" y="340" width="210" height="128" rx="24" fill="#C084FC" stroke="#121212" stroke-width="2"/><text x="766" y="382" font-size="12" opacity=".55">02</text><text x="766" y="420" font-size="18" font-weight="600">当前照片</text><text x="766" y="449" font-size="13">等待上传</text></g><g id="upload"><rect x="438" y="542" width="510" height="118" rx="24" fill="#F2F1E6" stroke="#121212" stroke-width="2"/><text x="470" y="592" font-size="21" font-weight="600">上传母版照片</text><text x="470" y="624" font-size="13" opacity=".58">拖入或选择一张照片</text><circle cx="888" cy="601" r="25" fill="#A855F7" stroke="#121212" stroke-width="2"/><path d="M879 601h18M888 592v18" stroke="#121212" stroke-width="2.5" stroke-linecap="round"/></g><g id="composer"><rect x="438" y="710" width="510" height="76" rx="22" fill="#F2F1E6" stroke="#121212" stroke-width="2"/><text x="470" y="756" font-size="15" opacity=".52">告诉我想保留什么……</text><circle cx="904" cy="748" r="18" fill="#A855F7"/><path d="M897 748h14M904 741v14" stroke="#121212" stroke-width="2" stroke-linecap="round"/></g></g>
  <g id="aside" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" fill="#121212"><path d="M1056 104h212" stroke="#121212" stroke-width="2"/><text x="1056" y="142" font-size="12" letter-spacing="1.5" opacity=".55">NEXT</text><text x="1056" y="182" font-size="18" font-weight="600">先放入你的标准</text><text x="1056" y="216" font-size="14" opacity=".62">之后每次上传照片，</text><text x="1056" y="240" font-size="14" opacity=".62">都可以直接和我说。</text><rect x="1056" y="288" width="182" height="36" rx="18" fill="#A855F7"/><text x="1080" y="311" font-size="13">已有母版，开始对齐</text></g>
</svg>
